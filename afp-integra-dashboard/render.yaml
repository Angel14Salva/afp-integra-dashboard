services:
  - type: web
    name: afp-integra-dashboard
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AWS_DEFAULT_REGION
        value: us-east-2
      - key: ATHENA_DB
        value: afp_gold
      - key: ATHENA_WORKGROUP
        value: primary
      - key: ATHENA_OUTPUT
        value: s3://afp-integra-gold-672469410615/_athena/
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
